name: validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static validation
        run: python3 -I tests/validate.py
      - name: Deliberate-breakage tests (validators must detect mutations)
        run: python3 -I tests/test_mutations.py
      - name: Helper (ab.py) behaviour and hostile-input tests
        run: python3 -I tests/test_ab.py
      - name: Installer and hook tests
        run: bash tests/test-install.sh
      - name: Website build is up to date
        run: |
          python3 -I site/build.py
          git diff --exit-code -- docs/ ':!docs/assets/og-image.png'
      - name: Website checks
        run: python3 -I site/check.py
