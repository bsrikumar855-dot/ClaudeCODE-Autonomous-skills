name: Feature request
description: Suggest an improvement to AUTO-BUILDER
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do and what gets in the way?
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: If it relies on a Claude Code feature or frontmatter field, link the official documentation page.
    validations: {required: true}
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
