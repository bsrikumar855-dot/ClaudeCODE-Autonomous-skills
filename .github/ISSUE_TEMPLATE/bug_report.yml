name: Bug report
description: Something in AUTO-BUILDER (skill, agents, installers, hooks, site) does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please do not include secrets, tokens or private code. For security issues see SECURITY.md instead."
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Expected vs actual behaviour.
    validations: {required: true}
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact commands, the /auto-builder goal you used, and which step went wrong.
    validations: {required: true}
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [Skill (SKILL.md), Subagent, install.sh, install.ps1, Hook script, Website, Docs, Other]
    validations: {required: true}
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, shell, Claude Code version (claude --version), install mode (personal/project).
    validations: {required: true}
  - type: textarea
    id: logs
    attributes:
      label: Output / logs
      render: shell
